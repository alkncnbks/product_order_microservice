version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: alkan
      MONGO_INITDB_ROOT_PASSWORD: 123456
    networks:
      - mongo-compose-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
        ME_CONFIG_OPTIONS_EDITORTHEME: default
        ME_CONFIG_MONGODB_SERVER: mongodb
        ME_CONFIG_MONGODB_PORT: 27017
        ME_CONFIG_MONGODB_ENABLE_ADMIN: true
        ME_CONFIG_MONGODB_AUTH_DATABASE: orderdb
        ME_CONFIG_MONGODB_ADMINUSERNAME: alkan
        ME_CONFIG_MONGODB_ADMINPASSWORD: 123456
        ME_CONFIG_MONGODB_URL: "mongodb://alkan:123456@mongodb:27017/"

    depends_on:
      - mongodb
    networks:
      - mongo-compose-network
    restart: on-failure

networks:
  mongo-compose-network:
    driver: bridge



